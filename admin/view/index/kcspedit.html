{include file="public/headerny" /}
 	<body class="bg-light">
		<div class="osahan-header-main py-3 px-4 sticky-top bg-white">
			<div class="d-flex align-items-center">
				<div class="gap-3 d-flex align-items-center"><a href="#" onclick="history.go(-1);"><i
							class="bi bi-arrow-left d-flex text-success h3 m-0 back-page"></i></a>
					<h3 class="fw-bold m-0">库存商品管理</h3>
				</div>
			</div>
		</div>
<link rel="stylesheet" href="/public/static/setting/css/style.css">

<form id="contant-form" class="form" name="contact-form" action="{:url('admin/index/upkcspedit')}" method="post"  style="margin-top:20px;">
  <h1 class="form__headline">库存商品设置</h1>
  <div class="form__description">
    <p>请填写商品信息。</p>
  </div>
  
  <div class="form__group">
    <p class="form__group-header">
      <label class="form__group-label" for="tel">1.序号</label>
    </p>
    <div class="form__group-content">
      <div class="form__text-input">
        <p class="text-input">
          <input id="oldpass" class="text-input__body -placeholder-visible" type="text" name="myorder" value="{$all[0]['myorder']}" readonly="isReadonly">
          <span class="text-input__validator"></span>
        </p>
      </div>
    </div>
  </div>
  <div class="form__group">
    <p class="form__group-header">
      <label class="form__group-label" for="tel">2.商品名称</label>
    </p>
    <div class="form__group-content">
      <div class="form__text-input">
        <p class="text-input">
          <input id="exdh" class="text-input__body -placeholder-visible" type="text" name="myname" class="inpt-lag" value="{$all[0]['name']}">
          <span class="text-input__validator"></span>
        </p>
      </div>
      <p class="form__validation" data-validation="tel" role="alert" aria-live="assertive"></p>
    </div>
  </div>
  <div class="form__group">
    <p class="form__group-header">
      <label class="form__group-label" for="tel">3.库存量</label>
    </p>
    <div class="form__group-content">
      <div class="form__text-input">
        <p class="text-input">
          <input id="exdh" class="text-input__body -placeholder-visible" type="text" name="kcl" class="inpt-lag" value="{$all[0]['kcl']}">
          <span class="text-input__validator"></span>
        </p>
      </div>
      <p class="form__validation" data-validation="tel" role="alert" aria-live="assertive"></p>
    </div>
  </div>
  
  <div class="form__group">
    <p class="form__group-header">
      <label class="form__group-label" for="tel">4.库存预警</label>
    </p>
    <div class="form__group-content">
      <div class="form__text-input">
        <p class="text-input">
          <input id="exdh" class="text-input__body -placeholder-visible" type="text" name="kcyj" class="inpt-lag" value="{$all[0]['kcyj']}">
          <span class="text-input__validator"></span>
        </p>
      </div>
      <p class="form__validation" data-validation="tel" role="alert" aria-live="assertive"></p>
    </div>
  </div>
<div style="display:none;">
        
                        <input type="text" id="myjiag" name="mytd" class="inpt-lag" value="{$all[0]['tdjg']}"/>
        				<input type="text" id="myjiag" name="myjiag" class="inpt-lag" value="{$all[0]['jine']}"/>

						<input type="text" id="myvip" name="myvip" class="inpt-lag" value="{$all[0]['vjine']}" />

						<input type="text" id="mypath" name="mypath" class="inpt-lag" value="{$all[0]['mypath']}" />

						<textarea id="mytext" name="mytext" height="200px">{$all[0]['mytext']}</textarea>

							{volist name='cls' id='vox'}
								{if condition="($all[0]['tdjg']==$vox.id)"}
								<option value="{$vox.id}">{$vox.name}</option>
								{/if}
							{/volist}
							
							{volist name='cls' id='vox'}
								<option value="{$vox.id}">{$vox.name}</option>
							{/volist}

    <input type="text" name="myid" value="{$id}" style="display:none;">
    <input type="text" name="xid" value="{$xid}" style="display:none;">
</div>

  <div class="form__submit">
    <p class="form__validation" data-validation="submit" role="alert" aria-live="assertive"></p>
    <button class="button" type="submit">保存</button>
  </div>
</form>

 {include file="public/footer" /}
