    <div class="container calculator-container">
        <div class="row">
            <div class="col-md-12">
                <!-- 外径(长度)和第二外径(长度)在同一行 -->
                <div class="row dual-input mb-3">
                    <div class="col-md-6">
                        <label for="num1" class="form-label">外径(长度)：</label>

                    </div>
                    <div class="col-md-6">
                        <label for="num11" class="form-label">第二外径(长度)：</label>

                <div class="mb-3">

                </div>
                
                <!-- 两个厚度在同一行 -->
                <div class="row dual-input mb-3">
                    <div class="col-md-6">
                        <label for="num3" class="form-label">厚度：</label>
                        <input type="text" class="form-control" id="num3" onkeyup="calculate();" placeholder="请输入厚度">
                    </div>
                    <div class="col-md-6">
                        <label for="num33" class="form-label">厚度：</label>

                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="input-group">
                        <input type="text" class="form-control" id="num5" onkeyup="calculate();" placeholder="请输入单价">
                        <span class="input-group-text">单价 [元/kg]</span>
                    </div>
                </div>
                
                <div class="mb-3">

    <script>
        // 当前计算模式，默认为"huan"（环/管/圆板/高颈）
        let currentMode = "huan";
        
        // 设置当前计算模式
        function setMode(mode) {
            currentMode = mode;
            // 更新按钮样式
            document.getElementById("huanBtn").classList.toggle("active", mode === "huan");
            document.getElementById("banBtn").classList.toggle("active", mode === "ban");
            document.getElementById("huanBtn").classList.toggle("btn-success", mode === "huan");
            document.getElementById("huanBtn").classList.toggle("btn-outline-success", mode !== "huan");
            document.getElementById("banBtn").classList.toggle("btn-success", mode === "ban");
            document.getElementById("banBtn").classList.toggle("btn-outline-success", mode !== "ban");
            // 重新计算
            calculate();
        }
        
        // 输入验证函数
        function validateInput(value) {
            if (value === "") return 0;
            const num = parseFloat(value);
            return isNaN(num) ? 0 : num;
        }
        
        // 格式化数字，保留三位小数
        function formatNumber(num) {
            return num.toFixed(3);
        }
        
        // 使用您提供的原始算法 - 环/管/圆板/高颈计算函数
        function calculateHuan() {
            const nv1 = validateInput(document.getElementById("num1").value);
            const nv2 = validateInput(document.getElementById("num2").value);
            const nv3 = validateInput(document.getElementById("num3").value);
            const nv11 = validateInput(document.getElementById("num11").value);
            const nv33 = validateInput(document.getElementById("num33").value);
            const nv4 = validateInput(document.getElementById("num4").value);
            const nv5 = validateInput(document.getElementById("num5").value);
            
            // 使用原始算法中的公式
            const rv = (parseFloat(nv1) - (parseFloat(nv1)/2 + parseFloat(nv2)/2)) * 3.14 * 
                      (parseFloat(nv1)/2 + parseFloat(nv2)/2) * parseFloat(nv3) * parseFloat(nv4) / 1000000;
                      
            const rv1 = (parseFloat(nv11) - (parseFloat(nv11)/2 + parseFloat(nv2)/2)) * 3.14 * 
                       (parseFloat(nv11)/2 + parseFloat(nv2)/2) * parseFloat(nv33) * parseFloat(nv4) / 1000000;
            
            const mass = rv + rv1;
            const price = mass * parseFloat(nv5);
            
            return { mass, price };
        }
        
        // 使用您提供的原始算法 - 板计算函数
        function calculateBan() {
            const nv1 = validateInput(document.getElementById("num1").value);
            const nv2 = validateInput(document.getElementById("num2").value);
            const nv3 = validateInput(document.getElementById("num3").value);
            const nv4 = validateInput(document.getElementById("num4").value);
            const nv5 = validateInput(document.getElementById("num5").value);
            
            // 使用原始算法中的公式
            const rv = parseFloat(nv1) * parseFloat(nv2) * parseFloat(nv3) * parseFloat(nv4) / 1000000;
            const mass = rv;
            const price = rv * parseFloat(nv5);
            
            return { mass, price };
        }
        
        // 主计算函数
        function calculate() {
            let result;
            if (currentMode === "huan") {
                result = calculateHuan();
            } else {
                result = calculateBan();
            }
            // 更新结果显示
            document.getElementById("result").value = formatNumber(result.mass);
            document.getElementById("price").value = formatNumber(result.price);
        }
        
        // 初始化计算
        window.onload = calculate;
    </script>
    <script>
        // 示例：使用IntersectionObserver实现图片懒加载
        document.addEventListener('DOMContentLoaded', () => {
          const lazyImages = document.querySelectorAll('img[data-src]');
          
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                observer.unobserve(img);
              }
            });
          });
          
          lazyImages.forEach(img => observer.observe(img));
        });    
        // 示例：使用Web Worker处理复杂计算
        if (window.Worker) {
          const worker = new Worker('worker.js');
          
          // 主线程发送数据
          worker.postMessage({ data: largeArray });
          
          // 接收计算结果
          worker.onmessage = (e) => {
            renderResults(e.data);
          };
        }
    </script>
