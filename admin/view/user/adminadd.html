{include file="public/headerny" /}
<script>
// 完善表单验证：增加权限选择校验
function check() {
  var inputValue = document.getElementById('myInput').value;
  var inputValue2 = document.getElementById('myInput2').value;
  var inputValue3 = document.getElementById('myInput3').value;
  var authId = document.getElementById('auth_id').value; // 权限选择值

  // 姓名校验
  if (inputValue === '') {
    alert('用户名不能为空！');
    return false; // 阻止表单提交
  }
  // 手机号校验
  if (inputValue2 === '') {
    alert('手机号不能为空！');
    return false;
  } else if (!/^1[3-9]\d{9}$/.test(inputValue2)) { // 手机号格式校验
    alert('请输入有效的手机号！');
    return false;
  }
  // 密码校验
  if (inputValue3 === '') {
    alert('密码不能为空！');
    return false;
  } else if (inputValue3.length < 6) { // 密码长度校验
    alert('密码长度不能少于6位！');
    return false;
  }
  // 权限选择校验
  if (authId == 0) {
    alert('请选择用户权限！');
    return false;
  }

  return true; // 允许表单提交
};    
</script>
<link rel="stylesheet" href="/public/static/setting/css/style.css">

<form id="contant-form" class="form" name="contant-form" action="{:url('admin/user/adminaddup')}" method="post" onsubmit="return check();"  style="margin-top:20px;">
  <h1 class="form__headline">账户设置</h1>
  <div class="form__description">
    <p>请输入必要事项后，点确定后保存。</p>
  </div>
  
  <div class="form__group">
    <p class="form__group-header">
      <label class="form__group-label" for="tel">1.姓名</label>
    </p>
    <div class="form__group-content">
      <div class="form__text-input">
        <p class="text-input">
          <input  id="myInput" class="text-input__body -placeholder-visible" type="text" name="myname" value="" placeholder="请输入姓名">
          <span class="text-input__validator"></span>
        </p>
      </div>
    </div>
  </div>

  <div class="form__group">
    <p class="form__group-header">
      <label class="form__group-label" for="tel">2.手机号</label>
    </p>
    <div class="form__group-content">
      <div class="form__text-input">
        <p class="text-input">
          <input  id="myInput2" class="text-input__body -placeholder-visible" type="text" name="myphone" value="" placeholder="请输入手机号">
          <span class="text-input__validator"></span>
        </p>
      </div>
      <p class="form__validation" data-validation="tel" role="alert" aria-live="assertive"></p>
    </div>
  </div>
  
  <div class="form__group">
    <p class="form__group-header">
      <label class="form__group-label" for="tel">3.密码</label>
    </p>
    <div class="form__group-content">
      <div class="form__text-input">
        <p class="text-input">
          <input id="myInput3" class="text-input__body -placeholder-visible" type="password" name="repass" value="123456" placeholder="请输入密码">
          <span class="text-input__validator"></span>
        </p>
      </div>
      <p class="form__text" style="margin-top:8px; font-size:12px; color:#718096;">
        默认密码：123456，建议登录后修改
      </p>
    </div>
  </div>

  <!-- 新增：4.用户权限选择 -->
  <div class="form__group">
    <p class="form__group-header">
      <label class="form__group-label" for="auth_id">4.用户权限</label>
    </p>
    <div class="form__group-content">
      <div class="form__text-input">
        <p class="text-input">
          <select id="auth_id" name="auth_id" class="text-input__body -placeholder-visible" style="height:40px; padding:0 12px;">
            <option value="0">-- 请选择用户权限 --</option>
            {volist name="authList" id="auth"}
            <option value="{$auth.id}">
              {$auth.auth_name}（可访问：{php}
              $menuMap = ['1'=>'首页','2'=>'工作流','3'=>'车间加工','4'=>'外委加工','5'=>'库房入','6'=>'库房出','7'=>'报表','8'=>'期初设置','9'=>'单据管理','10'=>'用户设置','11'=>'系统设置','12'=>'帮助中心','13'=>'退出登录'];
              $menuIds = explode(',', $auth['menu_ids']);
              $menuNames = [];
              foreach($menuIds as $mid){
                $menuNames[] = $menuMap[$mid] ?? $mid;
              }
              echo implode('、', $menuNames);
              {/php}）
            </option>
            {/volist}
          </select>
          <span class="text-input__validator"></span>
        </p>
      </div>
      <p class="form__text" style="margin-top:8px; font-size:12px; color:#718096;">
        选择后用户仅能访问对应权限的菜单功能
      </p>
    </div>
  </div>

  <!-- 隐藏字段：传递当前管理员信息 -->
  <input type="text" name="user" value="{$user}" style="display:none;">
  <input type="text" name="id" value="{$id}" style="display:none;">

  <div class="form__submit">
    <p class="form__validation" data-validation="submit" role="alert" aria-live="assertive"></p>
    <button class="button" type="submit">保存</button>
  </div>
</form>

<hr class="mb-5">
<hr class="mb-4">
{include file="public/footer" /}
