<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<title>云点软件</title>
<meta name="description" content="Neat">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" user-scalable="no">

<link rel="stylesheet" href="/public/static/dlog/css/style.css?i=1">

<script src="/public/static/dlog/js/jquery.min.js"></script>

</head>
<body>

<header class="header">
	<div class="progress-bar"></div>
</header>
<div class="main-group">

	<img src="{$all[0]['mypath']}" width="100%">
	<h3>{$all[0]['name']}</h3>
	<p>{$all[0]['mytext']}</p>

</div>

<script type="text/javascript">
// 取消scroll事件的监听函数
$(window).off('scroll');
(function() {
	let progress_bar = $('.progress-bar');
	let win_h = $(window).height();
	let body_h = $('body').height();
	let sHeight = body_h - win_h;

	function updateProgress(p) {
		progress_bar.css('width', p * 100 + '%');
	}
	$(window).on('scroll', function() {
		window.requestAnimationFrame(function(){
			let perc = Math.max(0, Math.min(1, $(window).scrollTop() / sHeight));
			updateProgress(perc);
		});
	});
}());
</script>
</body>
</html>
