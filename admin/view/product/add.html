<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>添加产品分类</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2>添加产品分类</h2>
    <form method="post">
        <div class="form-group">
            <label>产品名称</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>金额</label>
            <input type="text" name="jine" class="form-control" required>
        </div>
        <div class="form-group">
            <label>VIP金额</label>
            <input type="text" name="vjine" class="form-control" required>
        </div>
        <div class="form-group">
            <label>库存量</label>
            <input type="number" name="kcl" class="form-control" required>
        </div>
        <div class="form-group">
            <label>父级分类</label>
            <select name="class" class="form-control">
                <option value="0">顶级分类</option>
                {volist name="products" id="product"}
                <option value="{$product.id}">{$product.name}</option>
                {/volist}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">提交</button>
    </form>
</div>
</body>
</html>
