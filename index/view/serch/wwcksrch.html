 {include file="public/header" /}
        
		<div class="header-area" id="headerArea">
			<div class="container h-100 d-flex align-items-center justify-content-between">
				<div class="back-button" onclick="history.go(-1);"><i class="lni lni-chevron-left"></i></div>
				<div class="page-heading">
					<h6 class="mb-0">请选择需要查询的月份</h6>
				</div>
				<div class="search-form"><a href="/index/serch/serch?id=1&kw=all"><i class="fa fa-search"></i></a></div>
			</div>
		</div>
		<style>
		    .single-trending-post{margin-bottom: 10px;}
		</style>
		<div class="page-content-wrapper">
			<div class="trending-news-wrapper">
				<div class="container">
					<div class="d-flex align-items-center justify-content-between">
						<h5 class="mb-3 newsten-title">全年共计出库({$allkg}KG)</h5>
							<p class="mb-3 line-height-1">
							    <select>
							        <option>{$year}</option>
							        <option>2024</option>
							        <option>2025</option>
							        <option>2026</option>
							        <option>2027</option>
							        <option>2028</option>
							        <option>2029</option>
							        <option>2030</option>
							    </select>
							</p>
					</div>
				</div>
				<div class="container">
                <hr>
                <span>年份：{$year}&nbsp;&nbsp;&nbsp;&nbsp;[{$xname}]</span>
                <hr>
                {volist name='m' id='vo'}
					<a href="/index/serch/wwckmlist?id={$id}&m={$vo.m}&y={$year}&bs={$vo.c}">
					<div class="single-trending-post d-flex" style="margin-bottom: 10px;">
						<div class="post-content">
						    <div style="width:100%;height:30px;">
						    <img src="/public/static/newskin/picture/rk.png" style="height:30px;">&nbsp;&nbsp;<span style="color:#3689f5">{$vo.m}月&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:#666;">[共计{$vo.c}笔出库]</span></span>
						</div>

						</div>
					</div>
					</a>
				{/volist}

  
  
                
				</div>
				<div class="container">
					<div class="text-center mt-3"><a class="btn btn-primary" href="#">更多数据</a></div>
				</div>
			</div>
		</div>

 {include file="public/footer" /}
