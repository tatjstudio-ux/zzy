  <script>
      function mselect(id){
          // 获取div元素
            var div = document.getElementById(id);
             // 假设我们有一个div元素
             var idv=id+"v"
            // 你想添加的类名
            var classNameToAdd = "bg-success";
             
            // 检查类是否存在，然后相应地添加或删除
            if (div.classList.contains(classNameToAdd)) {
                // 如果类存在，则删除它
                div.classList.remove(classNameToAdd);
                document.getElementById(idv).checked = false;
            } else {
                // 如果类不存在，则添加它
                div.classList.add(classNameToAdd);
                document.getElementById(idv).checked = true;
            }
        // 添加一个类
      }
      
  </script>
