 {include file="public/header" /}
<body>
	<div id="register-b">
		<!--html5 nav-->
		<nav class="j-nav navbar">
	        <div class="logo fl">
				<a href="#"></a>
			</div>
			<span class="user-title"></span>
	    </nav>
		<div class="register-box">
			<form class="am-form" action="{:url('Index/index/tdmy')}" method="post">
				<fieldset>
					<div class="am-form-group">
						<label for="doc-ipt-3" class="am-u-sm-2 j-form-label" style="padding-top: 0px;">
							<span class="registericon registericon-user"></span>
						</label>
						<input type="text" id="phone" name="phone" class="inpt-lag" value="{$xphone}" placeholder="请输入手机号!"/>
						<input type="text" name="idx" value="{$id}" class="inpt-lag" style="display: none;" />
					</div>
					<div class="text-left">
						<div id="msg" class="msg"></div>
					</div>	
				    <button class="btn am-btn am-btn-primary but-lag" onclick="return check()" type="submit">下一步</button>
				</fieldset>
			</form>
		</div>
	</div>
	<style>
		.inpx{
			height: 80px;
			margin-bottom: 0;
			font-weight: normal;
			line-height: 1;
			color: #555;
			text-align: center;
			background-color: #EEE;
			border: 1px solid #CCC;
			border-radius: 4px;
			padding-top: 30px;
		}
		.inpt-lag{
			height: 80px;
			font-size: 24px;
		}
		.but-lag{
			height: 80px;
			width: 100%;
			font-size:16px;
			margin-top: 10px;
		}
		.msg{
			color: red;
			font-size: 18px;
		}
	</style>
<script type="text/javascript">
	function check(){
		var phone = document.getElementById('phone').value;
		if (!(/^1(3|4|5|6|7|8|9)\d{9}$/.test(phone))) {
			document.getElementById("msg").innerHTML="手机号码错误！";
			return false;
		}
	}
	</script>
