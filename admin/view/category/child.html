<ul class="list-group">
    {volist name="data" id="child"}
    <li class="list-group-item category-item">
        <div class="d-flex justify-content-between align-items-center">
            <span>{$child.indent}├─ {$child.name}</span>
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-primary btn-sm" onclick="editCategory({$child.id})">
                    <i class="fa fa-edit"></i> 编辑
                </button>
                <button class="btn btn-outline-danger btn-sm" onclick="deleteCategory({$child.id})">
                    <i class="fa fa-trash"></i> 删除
                </button>
            </div>
        </div>
    </li>
    {/volist}
</ul>
