<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>产品分类管理</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2>产品分类管理</h2>
    <a href="{:url('add')}" class="btn btn-primary">添加分类</a>
    <table class="table table-bordered table-hover mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>产品名称</th>
                <th>金额</th>
                <th>VIP金额</th>
                <th>库存量</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {volist name="topProducts" id="product"}
            <tr>
                <td>{$product.id}</td>
                <td>{$product.name}</td>
                <td>{$product.jine}</td>
                <td>{$product.vjine}</td>
                <td>{$product.kcl}</td>
                <td>
                    <a href="{:url('edit', ['id'=>$product.id])}" class="btn btn-sm btn-info">编辑</a>
                    <a href="{:url('delete', ['id'=>$product.id])}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除吗？')">删除</a>
                </td>
            </tr>
            {/volist}
        </tbody>
    </table>
</div>
</body>
</html>
